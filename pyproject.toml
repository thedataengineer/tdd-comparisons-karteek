[project]
name = "tdd-ablation"
version = "0.1.0"
description = "Reproducible toolkit for TDD practice ablation study"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
tdd-ablation = "tdd_ablation.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
]

[tool.pytest.ini_options]
markers = [
    "container: tests requiring container runtime (docker/podman)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdd_ablation"]
